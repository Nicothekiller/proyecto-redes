name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - name: Ruff format check
        run: nix develop .#ci -c ruff format --check server tests

      - name: Ruff lint
        run: nix develop .#ci -c ruff check server tests

      - name: Type check
        run: nix develop .#ci -c ty check server tests

      - name: Test check
        run: nix develop .#ci -c pytest
