name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Ruff format check
        run: nix develop .#ci -c ruff format --check server

      - name: Ruff lint
        run: nix develop .#ci -c ruff check server

      - name: Type check
        run: nix develop .#ci -c ty check server
