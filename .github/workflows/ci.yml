name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - name: Ruff format check
        run: nix develop .#ci -c ruff format --check server client tests

      - name: Ruff lint
        run: nix develop .#ci -c ruff check server client tests

      - name: Type check
        run: nix develop .#ci -c ty check server client tests

      - name: Test check
        run: nix develop .#ci -c pytest

      - name: Frontend install
        run: nix develop .#ci -c bash -c 'cd frontend && bun install --frozen-lockfile'

      - name: Frontend check
        run: nix develop .#ci -c bash -c 'cd frontend && bun run check'

      - name: Frontend lint
        run: nix develop .#ci -c bash -c 'cd frontend && bun run lint'

      - name: Frontend build
        run: nix develop .#ci -c bash -c 'cd frontend && bun run --bun build'

      - name: Compose config
        run: API_KEY=ci docker compose config >/dev/null

      - name: Backend image
        run: docker build -f Dockerfile.server -t overlay-backend .

      - name: Frontend image
        run: docker build -f frontend/Dockerfile -t overlay-frontend frontend
