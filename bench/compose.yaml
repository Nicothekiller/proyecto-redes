name: overlay-bench

x-node: &node
  image: overlay-bench-nix
  build:
    context: ..
    dockerfile: bench/Dockerfile
  cap_add: [NET_ADMIN]
  devices: [/dev/net/tun]
  stop_grace_period: 3s
  volumes:
    - ..:/repo:ro
  environment:
    API_KEY: ${API_KEY:-benchkey}
    PYTHONDONTWRITEBYTECODE: "1"

services:
  server:
    <<: *node
    command: uvicorn server.main:app --host 0.0.0.0 --port 8000
    environment:
      API_KEY: ${API_KEY:-benchkey}
      DATABASE_URL: sqlite:////data/overlay.db
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ..:/repo:ro
      - server-data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000"]
      interval: 2s
      retries: 30
    networks:
      lan:
        ipv4_address: 172.30.0.10

  client:
    <<: *node
    command: python3 -m client join --server server --key ${API_KEY:-benchkey}
    deploy:
      replicas: ${CLIENTS:-3}
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-d", "/sys/class/net/wg0"]
      interval: 2s
      retries: 30
    networks: [lan]

volumes:
  server-data:

networks:
  lan:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25
