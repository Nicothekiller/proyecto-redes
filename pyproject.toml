[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ty.environment]
python-version = "3.13"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
